---
baseURL: "https://mx-os.mx/"
title: Fundación MxOS
copyright: "Fundación MxOS, A.C. (en formación) | GPLv3"
locale: "es-mx"
defaultContentLanguage: es

pagination:
  pagerSize: 5

enableRobotsTXT: true

minify:
  minifyOutput: true

sitemap:
  changeFreq: weekly
  priority: 0.5

outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - llms

markup:
  highlight:
    style: monokai
    noClasses: false

params:
  contentTypeName: posts
  showMenuItems: 7
  showLanguageSelector: false
  fullWidthTheme: false
  centerTheme: true
  autoCover: true
  showLastUpdated: false
  updatedDatePrefix: Actualizado

languages:
  es:
    label: Español
    locale: es-mx
    title: Fundación MxOS
    params:
      subtitle: "Sitio oficial de la Fundación MxOS: construyendo soberanía tecnológica con una distribución Linux segura, abierta y adaptada a México."
      owner: Fundación MxOS
      keywords: "fundación, mxos, mx-os, software libre, gnu, linux"
      copyright: CC-BY-SA 2025
      menuMore: más
      postsFor: Artículos para
      readMore: Leer más
      readOtherPosts: Leer otros artículos
      newerPosts: Artículos nuevos
      olderPosts: Artículos viejos
      missingContentMessage: Página no encontrada...
      missingBackButtonLabel: Regresar al inicio
      minuteReadingTime: min de lectura
      words: palabras
      logo:
        logoText: Fundación MxOS
        logoHomeLink: /
    menu:
      main:
        - identifier: acerca
          name: Acerca
          url: /acerca
          weight: -15

        - identifier: colabora
          name: Colabora
          url: /colabora
          weight: -14

        - identifier: blog
          name: Blog
          url: /posts
          weight: -12

        - identifier: documentación
          name: Docs
          url: https://docs.mx-os.mx/
          weight: -10

        - identifier: cuentas
          name: Cuentas
          url: /cuentas
          weight: -5

        - identifier: contacto
          name: Contacto
          url: /contacto

security:
  exec:
    allow:
      - ^(dart-)?sass(-embedded)?$
      - ^go$
      - ^git$
      - ^npx$
      - ^postcss$
      - ^tailwindcss$
      - ^pandoc
      - ^rst2html
...
