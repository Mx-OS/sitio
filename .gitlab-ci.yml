default:
  image: docker.io/library/alpine:latest
  before_script:
    - apk add -U --no-cache hugo py3-docutils py3-pygments brotli gzip

test:  # builds and tests your site on merge requests and other branches
  script:
    - hugo
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:  # deploys the compiled site to GitLab Pages on the default branch
  script:
    - hugo
    - find public -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.xml' -o -name '*.txt' -o -name '*.svg' -o -name '*.json' \) -exec gzip -f -k -9 {} \; -exec brotli -f -k -q 11 {} \;
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment: production
